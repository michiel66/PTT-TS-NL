
name: Bouw PTT-TS-NL Windows 0.6.0 Multicolor interface

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: PTT-TS-NL Windows 64-bit
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      WEBSPEAK3_COMMIT: c2b52b323d2ef10e388b2b600444a98390c5cc7a
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Project ophalen
        uses: actions/checkout@v4

      - name: Eerder groen gebouwde Android-weergave ophalen
        uses: actions/checkout@v4
        with:
          repository: michiel66/PTT-TS-NL
          ref: 0f0c7cd2416c2a8492dc8f457bc8c629134c4eb1
          path: known-good

      - name: Groen gebouwde versie 0.5.1 ophalen
        uses: actions/checkout@v4
        with:
          repository: michiel66/PTT-TS-NL
          ref: 3a10277167685c326fc55b797732bd28cfffde69
          path: green-051

      - name: Werkende TeamSpeak Windows basis ophalen
        uses: actions/checkout@v4
        with:
          repository: michiel66/PTTConnect-PC
          ref: 8ed94f98dae6cfce47e90116fe58b2f4392a6919
          path: pttbase

      - name: Nederlandse Android aanpassingen ophalen
        uses: actions/checkout@v4
        with:
          repository: michiel66/TS6-Droid-NL
          path: android-nl

      - name: Originele Android broncode ophalen
        uses: actions/checkout@v4
        with:
          repository: YUAXI/TS6_Droid_CN
          ref: 56d3b4d1991a4c565b1f75f419f4563e772f9614
          path: android-source

      - name: Node installeren
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rust installeren
        uses: dtolnay/rust-toolchain@stable

      - name: TeamSpeak engine ophalen
        shell: bash
        run: |
          set -euo pipefail
          git clone --recurse-submodules https://github.com/Moepchi/webspeak3.git upstream
          cd upstream
          git checkout "$WEBSPEAK3_COMMIT"
          git submodule update --init --recursive

      - name: Werkende TeamSpeak en PTT functies toepassen
        shell: bash
        run: |
          set -euo pipefail
          python pttbase/windows/patch_webspeak3.py

      - name: Bewezen werkende TeamSpeak interface achtergrond en rogerpiep toepassen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('green-051/.github/workflows/build-windows.yml')
          source = workflow.read_text(encoding='utf-8')

          steps = [
              'Android-weergave uit groene versie 0.3.0 toepassen zonder WSL',
              'Eigen achtergrond toevoegen aan instellingen',
              'Drie-tonige rogerpiep voor alle TeamSpeak gebruikers',
          ]

          for name in steps:
              marker = (
                  f'      - name: {name}\n'
                  '        shell: bash\n'
                  '        run: |\n'
              )
              if source.count(marker) != 1:
                  raise RuntimeError(f'Bewezen bouwstap niet gevonden: {name}')
              section = source.split(marker, 1)[1].split('\n      - name:', 1)[0]
              lines = [
                  line[10:] if line.startswith('          ') else line
                  for line in section.splitlines()
              ]
              start = lines.index("python - <<'PY'") + 1
              end = len(lines) - 1 - lines[::-1].index('PY')
              if end <= start:
                  raise RuntimeError(f'Ongeldige Python-stap: {name}')
              script = '\n'.join(lines[start:end]) + '\n'
              print(f'Bouwstap uitvoeren: {name}', flush=True)
              exec(compile(script, name, 'exec'), {'__name__': '__main__'})

          print('TeamSpeak, PTT, achtergrond en rogerpiep overgenomen')
          PY

      - name: Multicolor 0.6.0 design uit voorbeeldfoto toepassen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          app_path = Path('upstream/web/src/App.tsx')
          css_path = Path('upstream/web/src/App.css')
          package_path = Path('windows/package.json')
          app = app_path.read_text(encoding='utf-8')

          def one(old: str, new: str, label: str):
              global app
              count = app.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: verwacht 1 locatie, gevonden {count}')
              app = app.replace(old, new, 1)

          # Moderne iconen en werkende navigatie.
          new_nav = r'''
                            <nav className="tsnl-top" aria-label="PTT Communicator navigatie">
                              <button className="tsnl-menu-trigger" type="button"
                                title="Menu en extra functies"
                                aria-label="Menu openen"
                                onClick={() => setTsNlPanel(v => v === "menu" ? null : "menu")}>
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                  <path d="M4 7h16M4 12h16M4 17h16" />
                                </svg>
                              </button>

                              <div className="tsnl-brand">
                                <span className="tsnl-brand-mark" aria-hidden="true" />
                                <div className="tsnl-brand-label">
                                  <strong>PTT Communicator</strong>
                                  <small>TeamSpeak · Push-to-Talk</small>
                                </div>
                              </div>
                              <span className="tsnl-nav-divider" aria-hidden="true" />

                              <button type="button" className="tsnl-nav-btn tsnl-server-btn"
                                title="Server verbinden of servermenu openen"
                                onClick={() => setTsNlPanel(v => v === "menu" ? null : "menu")}>
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                  <rect x="4" y="4" width="16" height="7" rx="2" />
                                  <rect x="4" y="13" width="16" height="7" rx="2" />
                                  <path d="M8 7.5h.01M8 16.5h.01" />
                                </svg>
                                <span>Server</span>
                              </button>

                              <button type="button" className="tsnl-nav-btn tsnl-channels-btn"
                                title="TeamSpeak kanalen bekijken"
                                onClick={() => setTsNlPanel(null)}>
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                  <circle cx="12" cy="12" r="2" />
                                  <path d="M7.3 7.3a6.6 6.6 0 0 0 0 9.4M16.7 7.3a6.6 6.6 0 0 1 0 9.4M4.3 4.3a11 11 0 0 0 0 15.4M19.7 4.3a11 11 0 0 1 0 15.4" />
                                </svg>
                                <span>Channels</span>
                              </button>

                              <button type="button" className="tsnl-nav-btn tsnl-users-btn"
                                title="Online gebruikers"
                                onClick={() => setTsNlPanel(v => v === "users" ? null : "users")}>
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                  <circle cx="9" cy="7" r="3" />
                                  <circle cx="17.5" cy="8" r="2.3" />
                                  <path d="M2.5 20v-2a6.5 6.5 0 0 1 13 0v2zM16 14.5a5 5 0 0 1 5.5 5.5" />
                                </svg>
                                <span>Users</span>
                              </button>

                              <button type="button" className="tsnl-nav-btn tsnl-settings-btn"
                                title="Instellingen, achtergrond en rogerpiep"
                                onClick={() => setTsNlPanel(v => v === "settings" ? null : "settings")}>
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                  <path d="M12 2.5l1.7 2.1 2.6-.2.7 2.5 2.5.9-.4 2.7 1.9 1.5-1.9 1.5.4 2.7-2.5.9-.7 2.5-2.6-.2L12 21.5l-1.7-2.1-2.6.2-.7-2.5-2.5-.9.4-2.7L3 12l1.9-1.5-.4-2.7 2.5-.9.7-2.5 2.6.2z" />
                                  <circle cx="12" cy="12" r="3.1" />
                                </svg>
                                <span>Settings</span>
                              </button>
                            </nav>
          '''

          nav_matches = list(re.finditer(
              r'<nav className="tsnl-top"[^>]*>.*?</nav>',
              app,
              flags=re.S
          ))
          if len(nav_matches) != 1:
              raise RuntimeError(f'Navigatiebalk: {len(nav_matches)} overeenkomsten')
          nav = nav_matches[0]
          app = app[:nav.start()] + new_nav + app[nav.end():]

          # Kanalenpaneel met echte TeamSpeak-informatie.
          main_before = '<div className="tsnl-list">'
          main_after = r'''                  <section className="tsnl-main-card" aria-label="TeamSpeak kanalen">
                              <div className="tsnl-section-title">
                                <span className="tsnl-equalizer" aria-hidden="true">▏▍▎▍▏</span>
                                <span>Signal Processing</span>
                                <span className="tsnl-equalizer" aria-hidden="true">▏▍▎▍▏</span>
                              </div>
                            <div className="tsnl-list">'''
          one(main_before, main_after, 'Kanalenpaneel openen')
          one(
              '{tsNlPanel && (',
              '</section>\n\n                  {tsNlPanel && (',
              'Kanalenpaneel sluiten'
          )

          # Alleen de oorspronkelijke werkende PTT-knop behouden.
          footer = list(re.finditer(
              r'<div className="tsnl-footer">.*?</div>',
              app,
              flags=re.S
          ))
          if len(footer) != 1:
              raise RuntimeError(f'PTT onderbalk: {len(footer)} overeenkomsten')
          old_footer = footer[0].group()
          ptt_class = old_footer.find('className={`tsnl-ptt')
          ptt_start = old_footer.rfind(
              '<button', 0, ptt_class
          ) if ptt_class >= 0 else -1
          if ptt_start < 0:
              raise RuntimeError('De werkende PTT-knop ontbreekt')
          ptt_end = old_footer.find('</button>', ptt_start)
          if ptt_end < 0:
              raise RuntimeError('Het einde van de PTT-knop ontbreekt')
          ptt = old_footer[ptt_start:ptt_end + len('</button>')]
          if 'setPushToTalk(true)' not in ptt or 'setPushToTalk(false)' not in ptt:
              raise RuntimeError('PTT-bediening is onvolledig')

          ptt, ptt_replacements = re.subn(
              r'<span>🎙</span>\s*<small>PTT</small>',
              '''<svg className="tsnl-ptt-microphone" viewBox="0 0 24 24" aria-hidden="true">
                                  <rect x="9" y="2" width="6" height="13" rx="3" />
                                  <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5v4M8 21.5h8" />
                                </svg>
                                <span className="tsnl-ptt-text">PTT</span>''',
              ptt,
              count=1
          )
          if ptt_replacements != 1:
              raise RuntimeError('PTT tekst en pictogram werden niet gevonden')

          new_footer = (
              '<div className="tsnl-footer">\n' +
              ptt +
              '\n                  </div>'
          )
          app = app[:footer[0].start()] + new_footer + app[footer[0].end():]

          # Microfoon, luidspreker en chat onder het menu.
          old_menu = r'\{tsNlPanel === "menu" && <>\s*<strong>PTT-TS-NL</strong>'
          new_menu = r'''{tsNlPanel === "menu" && <>
                                  <strong>PTT Communicator</strong>
                                  <span className="tsnl-menu-caption">Server & bediening</span>

                                  <button type="button" onClick={() => void handleToggleMic()}>
                                    {micOn ? "🎙 Microfoon uitschakelen" : "🎙 Microfoon inschakelen"}
                                  </button>

                                  <button type="button" disabled={!connected}
                                    onClick={handleToggleOutputMuted}>
                                    {outputMuted ? "🔊 Luidspreker inschakelen" : "🔈 Luidspreker dempen"}
                                  </button>

                                  <button type="button" disabled={!connected}
                                    onClick={() => setTsNlPanel("chat")}>
                                    💬 TeamSpeak chat
                                  </button>'''
          app, count = re.subn(
              old_menu,
              lambda _: new_menu,
              app,
              count=1
          )
          if count != 1:
              raise RuntimeError('Functies in menu: anker niet gevonden')

          # Kanaalnamen visueel opschonen, servergegevens blijven gelijk.
          helper = r'''function tsnlCleanChannelName(name: string): string {
            const cleaned = name.replace(/^\s*[-<>→←]+\s*/, "").replace(/\s*[-<>→←]+\s*$/, "").trim();
            return cleaned || name;
          }

          '''
          one(
              'function TsNlTree({',
              helper + 'function TsNlTree({',
              'Kanaalnaamopmaak'
          )
          tree_start = app.index('function TsNlTree({')
          tree_end = app.index('function AppInner()', tree_start)
          tree = app[tree_start:tree_end]
          if tree.count('>{ch.name}</span>') != 1:
              raise RuntimeError('Kanaalnaamtekst kon niet worden opgemaakt')
          tree = tree.replace(
              '>{ch.name}</span>',
              '>{tsnlCleanChannelName(ch.name)}</span>',
              1
          )

          # Duidelijke radio-iconen bij de kanalen.
          icon_old = '<span className="tsnl-wave" aria-hidden="true">◉</span>'
          icon_new = r'''<span className="tsnl-wave" aria-hidden="true">
                                    <svg viewBox="0 0 24 24">
                                      <circle cx="12" cy="12" r="2" />
                                      <path d="M7.2 7.2a7 7 0 0 0 0 9.6m9.6-9.6a7 7 0 0 1 0 9.6M4.3 4.3a11 11 0 0 0 0 15.4m15.4-15.4a11 11 0 0 1 0 15.4" />
                                    </svg>
                                  </span>'''
          if tree.count(icon_old) != 1:
              raise RuntimeError('Radio-icoon ontbreekt in de kanalenlijst')
          tree = tree.replace(icon_old, icon_new, 1)
          app = app[:tree_start] + tree + app[tree_end:]
          app_path.write_text(app, encoding='utf-8')

          css = r'''
          /* PTT Communicator 0.6.0 multicolor */

          .ts-app.tsnl-android {
            background:#080c20!important;
            color:#f3f2fc!important;
            font-family:"Segoe UI",Inter,Arial,sans-serif!important;
          }

          .ts-app.tsnl-android .tsnl-shell {
            max-width:none;
            width:100%;
            isolation:isolate;
            overflow:hidden;
            background:
              radial-gradient(ellipse 40% 32% at -4% 8%,rgba(160,48,252,.30),transparent 85%),
              radial-gradient(ellipse 38% 34% at -7% 86%,rgba(0,219,196,.25),transparent 87%),
              radial-gradient(ellipse 38% 29% at 108% 80%,rgba(255,143,41,.28),transparent 82%),
              radial-gradient(ellipse 55% 52% at 63% 50%,rgba(71,28,119,.19),transparent 90%),
              linear-gradient(125deg,#080f28 0%,#10152f 42%,#1c1131 100%);
            box-shadow:none;
          }

          .ts-app.tsnl-android .tsnl-shell::before,
          .ts-app.tsnl-android .tsnl-shell::after {
            content:"";
            position:absolute;
            width:72%;
            height:38%;
            border-radius:50%;
            border:2px solid rgba(165,61,240,.24);
            pointer-events:none;
            z-index:0;
            filter:blur(1px);
          }

          .ts-app.tsnl-android .tsnl-shell::before {
            top:-22%;
            left:-28%;
            transform:rotate(-21deg);
          }

          .ts-app.tsnl-android .tsnl-shell::after {
            bottom:-23%;
            right:-31%;
            transform:rotate(-18deg);
            border-color:rgba(255,143,39,.32);
          }

          .ts-app.tsnl-android .tsnl-top,
          .ts-app.tsnl-android .tsnl-main-card,
          .ts-app.tsnl-android .tsnl-footer {
            position:relative;
            z-index:1;
          }

          .ts-app.tsnl-android .tsnl-top {
            height:100px;
            flex:0 0 100px;
            max-width:1150px;
            width:calc(100% - 36px);
            margin:0 auto;
            padding:12px 8px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:8px;
            background:transparent;
            border:0;
          }

          .ts-app.tsnl-android .tsnl-top button {
            background:transparent;
            border:none;
            color:#f5f5ff;
            min-height:50px;
            cursor:pointer;
          }

          .ts-app.tsnl-android .tsnl-menu-trigger {
            flex:0 0 43px;
            width:43px;
            height:51px;
            display:grid;
            place-items:center;
            border-radius:12px;
          }

          .ts-app.tsnl-android .tsnl-menu-trigger svg {
            width:27px;
            height:27px;
            stroke:#edf4ff;
            stroke-width:2;
            fill:none;
            stroke-linecap:round;
          }

          .ts-app.tsnl-android .tsnl-brand {
            display:flex;
            align-items:center;
            gap:13px;
            min-width:190px;
            margin-right:auto;
          }

          .ts-app.tsnl-android .tsnl-brand-mark {
            position:relative;
            display:block;
            width:38px;
            height:43px;
            border-top:5px solid #28ddd0;
            border-right:5px solid #a64dfa;
            border-radius:70% 70% 70% 25%;
            transform:rotate(-18deg);
          }

          .ts-app.tsnl-android .tsnl-brand-mark::before {
            content:"";
            position:absolute;
            inset:7px;
            border-top:4px solid #24d4d1;
            border-right:4px solid #8b5cf6;
            border-radius:70% 70% 70% 25%;
          }

          .ts-app.tsnl-android .tsnl-brand-label {
            display:flex;
            flex-direction:column;
            gap:4px;
            white-space:nowrap;
          }

          .ts-app.tsnl-android .tsnl-brand-label strong {
            font-size:21px;
            font-weight:750;
            letter-spacing:-.4px;
            color:#f7f7ff;
          }

          .ts-app.tsnl-android .tsnl-brand-label small {
            font-size:13px;
            color:#cbd1e8;
          }

          .ts-app.tsnl-android .tsnl-nav-divider {
            width:1px;
            height:49px;
            background:rgba(157,153,206,.45);
            margin:0 14px;
          }

          .ts-app.tsnl-android .tsnl-nav-btn {
            width:124px;
            height:73px;
            min-width:87px;
            border-radius:16px;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            gap:6px;
            padding:7px 9px;
            font-size:16px;
            white-space:nowrap;
            transition:background .16s,border .16s;
          }

          .ts-app.tsnl-android .tsnl-nav-btn svg,
          .ts-app.tsnl-android .tsnl-radio {
            width:29px;
            height:29px;
            fill:none;
            stroke:currentColor;
            stroke-width:1.9;
            stroke-linecap:round;
            stroke-linejoin:round;
          }

          .ts-app.tsnl-android .tsnl-top .tsnl-server-btn {
            color:#ffca59;
            background:linear-gradient(160deg,rgba(194,112,26,.35),rgba(72,43,70,.48));
            border:1px solid #f1a742;
            box-shadow:0 0 15px #fbaf4125,inset 0 0 12px #ffa43e18;
          }

          .ts-app.tsnl-android .tsnl-channels-btn svg {
            color:#c786ff;
          }

          .ts-app.tsnl-android .tsnl-users-btn svg {
            color:#69ed7b;
            fill:#69ed7b18;
          }

          .ts-app.tsnl-android .tsnl-settings-btn svg {
            color:#5cbafc;
          }

          .ts-app.tsnl-android .tsnl-nav-btn:hover {
            background-color:rgba(255,255,255,.10);
          }

          .ts-app.tsnl-android .tsnl-main-card {
            width:calc(100% - 70px);
            max-width:1090px;
            flex:1 1 auto;
            min-height:0;
            margin:0 auto 9px;
            border-radius:24px;
            border:1px solid rgba(157,105,224,.36);
            background:linear-gradient(128deg,rgba(10,26,53,.92),rgba(20,21,54,.86) 60%,rgba(41,22,57,.82));
            box-shadow:inset 0 1px 18px rgba(109,51,153,.09),0 10px 45px rgba(4,6,18,.19);
            display:flex;
            flex-direction:column;
            overflow:hidden;
          }

          .ts-app.tsnl-android .tsnl-section-title {
            flex:0 0 auto;
            height:73px;
            display:flex;
            align-items:center;
            justify-content:center;
            gap:18px;
            color:#f6f5ff;
            font-size:19px;
            font-weight:480;
          }

          .ts-app.tsnl-android .tsnl-equalizer {
            font-size:22px;
            font-weight:900;
            letter-spacing:1px;
            color:#22ded1;
            text-shadow:0 0 15px #00caba75;
          }

          .ts-app.tsnl-android .tsnl-list {
            flex:1 1 auto;
            height:auto;
            padding:5px 23px 22px;
            overflow:auto;
            background:transparent!important;
            scrollbar-color:#765d9c transparent;
            scrollbar-width:thin;
          }

          .ts-app.tsnl-android .tsnl-spacer {
            display:none!important;
          }

          .ts-app.tsnl-android .tsnl-branch {
            margin:0 0 8px;
          }

          .ts-app.tsnl-android .tsnl-channel,
          .ts-app.tsnl-android .tsnl-user {
            font-family:"Segoe UI",Arial,sans-serif;
            transition:background .12s,box-shadow .12s;
          }

          .ts-app.tsnl-android .tsnl-channel {
            min-height:51px;
            border-radius:16px;
            border:1px solid rgba(134,119,184,.24);
            background:linear-gradient(110deg,rgba(90,70,142,.33),rgba(50,61,103,.33))!important;
            color:#f7f7ff;
            padding-top:9px;
            padding-bottom:9px;
            font-size:17px;
            font-weight:500;
            gap:17px;
          }

          .ts-app.tsnl-android .tsnl-channel::before {
            content:"";
            flex:0 0 16px;
            width:16px;
            height:16px;
            border-radius:50%;
            border:2px solid #aeb2d2;
            background:transparent;
          }

          .ts-app.tsnl-android .tsnl-channel.tsnl-current-channel,
          .ts-app.tsnl-android .tsnl-channel.tsnl-chosen {
            border:1px solid #12e7db;
            color:white;
            background:linear-gradient(90deg,rgba(2,151,155,.55),rgba(6,90,112,.42))!important;
            box-shadow:0 0 20px rgba(13,201,190,.13),inset 0 0 18px rgba(29,215,202,.09);
            font-weight:700;
          }

          .ts-app.tsnl-android .tsnl-channel.tsnl-current-channel::before,
          .ts-app.tsnl-android .tsnl-channel.tsnl-chosen::before {
            border-color:#76ff75;
            background:#4edb59;
            box-shadow:0 0 0 3px #2aff542a,0 0 12px #56f18d9c;
          }

          .ts-app.tsnl-android .tsnl-wave {
            width:30px;
            flex:0 0 30px;
            color:#bf82ff;
            display:grid;
            place-items:center;
          }

          .ts-app.tsnl-android .tsnl-wave svg {
            width:28px;
            height:28px;
            fill:none;
            stroke:currentColor;
            stroke-width:1.9;
            stroke-linecap:round;
          }

          .ts-app.tsnl-android .tsnl-current-channel .tsnl-wave,
