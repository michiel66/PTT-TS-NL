
name: Bouw PTT-TS-NL Windows 0.5.1 Rogerpiep

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: PTT-TS-NL Windows 64-bit
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      WEBSPEAK3_COMMIT: c2b52b323d2ef10e388b2b600444a98390c5cc7a
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Project ophalen
        uses: actions/checkout@v4

      - name: Eerder groen gebouwde Android-weergave ophalen
        uses: actions/checkout@v4
        with:
          repository: michiel66/PTT-TS-NL
          ref: 0f0c7cd2416c2a8492dc8f457bc8c629134c4eb1
          path: known-good

      - name: Werkende TeamSpeak Windows basis ophalen
        uses: actions/checkout@v4
        with:
          repository: michiel66/PTTConnect-PC
          ref: 8ed94f98dae6cfce47e90116fe58b2f4392a6919
          path: pttbase

      - name: Nederlandse Android aanpassingen ophalen
        uses: actions/checkout@v4
        with:
          repository: michiel66/TS6-Droid-NL
          path: android-nl

      - name: Originele Android broncode ophalen
        uses: actions/checkout@v4
        with:
          repository: YUAXI/TS6_Droid_CN
          ref: 56d3b4d1991a4c565b1f75f419f4563e772f9614
          path: android-source

      - name: Node installeren
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rust installeren
        uses: dtolnay/rust-toolchain@stable

      - name: TeamSpeak engine ophalen
        shell: bash
        run: |
          set -euo pipefail
          git clone --recurse-submodules https://github.com/Moepchi/webspeak3.git upstream
          cd upstream
          git checkout "$WEBSPEAK3_COMMIT"
          git submodule update --init --recursive

      - name: Werkende TeamSpeak en PTT functies toepassen
        shell: bash
        run: |
          set -euo pipefail
          python pttbase/windows/patch_webspeak3.py

      - name: Android-weergave uit groene versie 0.3.0 toepassen zonder WSL
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path("known-good/.github/workflows/build-windows.yml")
          source = workflow.read_text(encoding="utf-8")
          marker = (
              "      - name: Bouw alleen het TS6 Droid scherm met live kanalen en PTT\n"
              "        shell: bash\n"
              "        run: |\n"
          )
          assert source.count(marker) == 1, "Groene bouwstap ontbreekt"
          block = source.split(marker, 1)[1].split("\n      - name:", 1)[0]
          lines = [
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          ]
          start = lines.index("python - <<'PY'") + 1
          end = len(lines) - 1 - lines[::-1].index("PY")
          assert end > start, "Ingesloten Python ontbreekt"
          code = "\n".join(lines[start:end]) + "\n"
          compile(code, "ts6_droid_scherm_v0_3.py", "exec")
          exec(
              compile(code, "ts6_droid_scherm_v0_3.py", "exec"),
              {"__name__": "__main__"},
          )
          print("Android-weergave 0.3.0 toegepast zonder Bash of WSL")
          PY

      - name: Eigen achtergrond toevoegen aan instellingen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          path = Path("upstream/web/src/App.tsx")
          app = path.read_text(encoding="utf-8")

          def once(old, new, label):
              global app
              count = app.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: {count} overeenkomsten")
              app = app.replace(old, new, 1)

          def once_regex(pattern, new, label):
              global app
              app, count = re.subn(pattern, lambda _: new, app, count=1)
              if count != 1:
                  raise RuntimeError(f"{label}: knop ontbreekt")

          helpers = r"""
          function tsnlBgDb(): Promise<IDBDatabase> {
            return new Promise((resolve, reject) => {
              const request = indexedDB.open("ptt-ts-nl-background", 1);
              request.onupgradeneeded = () => {
                if (!request.result.objectStoreNames.contains("wallpapers")) {
                  request.result.createObjectStore("wallpapers");
                }
              };
              request.onsuccess = () => resolve(request.result);
              request.onerror = () =>
                reject(request.error ?? new Error("Database niet beschikbaar"));
            });
          }

          async function tsnlBgRead(): Promise<Blob | null> {
            const db = await tsnlBgDb();
            return new Promise((resolve, reject) => {
              const tx = db.transaction("wallpapers", "readonly");
              const get = tx.objectStore("wallpapers").get("selected");
              get.onsuccess = () =>
                resolve(get.result instanceof Blob ? get.result : null);
              get.onerror = () => reject(get.error ?? new Error("Leesfout"));
              tx.oncomplete = () => db.close();
              tx.onabort = () => {
                db.close();
                reject(tx.error ?? new Error("Lezen afgebroken"));
              };
            });
          }

          async function tsnlBgWrite(image: Blob | null): Promise<void> {
            const db = await tsnlBgDb();
            return new Promise((resolve, reject) => {
              const tx = db.transaction("wallpapers", "readwrite");
              const store = tx.objectStore("wallpapers");
              if (image) store.put(image, "selected");
              else store.delete("selected");
              tx.oncomplete = () => {
                db.close();
                resolve();
              };
              tx.onerror = () => {
                db.close();
                reject(tx.error ?? new Error("Schrijffout"));
              };
              tx.onabort = () => {
                db.close();
                reject(tx.error ?? new Error("Opslaan afgebroken"));
              };
            });
          }
          """

          once(
              "function AppInner() {",
              helpers + "\nfunction AppInner() {",
              "Achtergrondfuncties",
          )

          state = r"""
            const [tsnlBgFile, setTsnlBgFile] = useState<Blob | null>(null);
            const [tsnlBgUrl, setTsnlBgUrl] = useState<string | null>(null);
            const [tsnlBgError, setTsnlBgError] = useState("");
            const tsnlBgPicker = useRef<HTMLInputElement | null>(null);

            useEffect(() => {
              let active = true;
              void tsnlBgRead().then(image => {
                if (active) setTsnlBgFile(image);
              }).catch(() => {
                if (active) setTsnlBgError("Achtergrond kon niet worden gelezen");
              });
              return () => { active = false; };
            }, []);

            useEffect(() => {
              if (!tsnlBgFile) {
                setTsnlBgUrl(null);
                return;
              }
              const url = URL.createObjectURL(tsnlBgFile);
              setTsnlBgUrl(url);
              return () => URL.revokeObjectURL(url);
            }, [tsnlBgFile]);
          """

          old = (
              'const [tsNlPanel, setTsNlPanel] = '
              'useState<"menu" | "info" | "users" | "chat" | null>(null);'
          )
          new = (
              'const [tsNlPanel, setTsNlPanel] = '
              'useState<"menu" | "info" | "users" | "chat" | '
              '"settings" | "background" | null>(null);'
          )
          once(old, new + state, "Instellingenstatus")

          once(
              '<div className="tsnl-shell">',
              r'''<div className="tsnl-shell" style={tsnlBgUrl ? {
                backgroundImage: `linear-gradient(rgba(9,29,64,.44), rgba(9,29,64,.57)), url("${tsnlBgUrl}")`,
                backgroundSize: "cover",
                backgroundPosition: "center",
                backgroundRepeat: "no-repeat"
              } : undefined}>''',
              "Achtergrondweergave",
          )

          once_regex(
              r'<button\s+onClick=\{\(\) => \{\s*setOptionsDialogOpen\(true\);\s*setTsNlPanel\(null\);\s*\}\}>⚙ Instellingen</button>',
              '<button onClick={() => setTsNlPanel("settings")}>⚙ Instellingen</button>',
              "Menuknop instellingen",
          )

          once_regex(
              r'<button\s+className="tsnl-minor"\s+title="Instellingen"\s+onClick=\{\(\) =>\s*setOptionsDialogOpen\(true\)\s*\}\s*>♧</button>',
              '<button className="tsnl-minor" title="Instellingen" onClick={() => setTsNlPanel(v => v === "settings" ? null : "settings")}>♧</button>',
              "Onderste instellingenknop",
          )

          settings = r"""
                      {tsNlPanel === "settings" && <>
                        <strong>⚙ Instellingen</strong>
                        <button type="button" onClick={() => {
                          setOptionsDialogOpen(true);
                          setTsNlPanel(null);
                        }}>🎙 Audio en PTT-instellingen</button>
                        <button type="button" onClick={() => {
                          setTsnlBgError("");
                          setTsNlPanel("background");
                        }}>🖼 Eigen achtergrond</button>
                      </>}

                      {tsNlPanel === "background" && <>
                        <strong>🖼 Eigen achtergrond</strong>
                        <p>Kies een foto van je computer. Je achtergrond blijft
                           lokaal bewaard bij het opnieuw starten.</p>
                        <input
                          className="tsnl-bg-picker"
                          ref={tsnlBgPicker}
                          type="file"
                          accept="image/png,image/jpeg,image/webp,image/gif"
                          aria-label="Achtergrond kiezen"
                          onChange={e => {
                            const file = e.currentTarget.files?.[0];
                            e.currentTarget.value = "";
                            if (!file) return;
                            if (!["image/png","image/jpeg","image/webp","image/gif"].includes(file.type)) {
                              setTsnlBgError("Gebruik JPG, PNG, WebP of GIF");
                              return;
                            }
                            if (file.size > 12 * 1024 * 1024) {
                              setTsnlBgError("De foto mag maximaal 12 MB zijn");
                              return;
                            }
                            void tsnlBgWrite(file).then(() => {
                              setTsnlBgFile(file);
                              setTsnlBgError("");
                            }).catch(() => setTsnlBgError("Opslaan mislukt"));
                          }}
                        />
                        <button type="button" onClick={() => tsnlBgPicker.current?.click()}>
                          📁 Eigen foto kiezen
                        </button>
                        <button type="button" onClick={() => {
                          void tsnlBgWrite(null).then(() => {
                            setTsnlBgFile(null);
                            setTsnlBgError("");
                          }).catch(() => setTsnlBgError("Herstellen mislukt"));
                        }}>🔄 Standaard blauwe achtergrond</button>
                        {tsnlBgError && <p role="alert">{tsnlBgError}</p>}
                        <button type="button" onClick={() => setTsNlPanel("settings")}>
                          ← Terug naar instellingen
                        </button>
                      </>}
          """

          once(
              '{tsNlPanel === "info" && <>',
              settings + '{tsNlPanel === "info" && <>',
              "Achtergrondmenu",
          )

          path.write_text(app, encoding="utf-8")
          with Path("upstream/web/src/App.css").open("a", encoding="utf-8") as f:
              f.write("""
          .ts-app.tsnl-android .tsnl-bg-picker { display:none!important; }
          .ts-app.tsnl-android .tsnl-list { background:transparent!important; }
          .ts-app.tsnl-android .tsnl-channelname,
          .ts-app.tsnl-android .tsnl-username,
          .ts-app.tsnl-android .tsnl-spacer {
            text-shadow:0 1px 5px rgba(4,20,49,.9);
          }
          """)

          pkg_path = Path("windows/package.json")
          package = json.loads(pkg_path.read_text(encoding="utf-8"))
          package["version"] = "0.4.4"
          pkg_path.write_text(json.dumps(package, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print("PTT-TS-NL 0.4.4: eigen achtergrond toegevoegd")
          PY

      - name: Drie-tonige rogerpiep voor alle TeamSpeak gebruikers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          voice_file = Path("upstream/web/src/voice.ts")
          app_file = Path("upstream/web/src/App.tsx")
          css_file = Path("upstream/web/src/App.css")
          voice = voice_file.read_text(encoding="utf-8")
          app = app_file.read_text(encoding="utf-8")

          def voice_once(old, new, label):
              global voice
              count = voice.count(old)
              if count != 1:
                  raise RuntimeError(f"Rogerpiep {label}: verwacht 1, gevonden {count}")
              voice = voice.replace(old, new, 1)

          def app_once(old, new, label):
              global app
              count = app.count(old)
              if count != 1:
                  raise RuntimeError(f"Rogerpiep {label}: verwacht 1, gevonden {count}")
              app = app.replace(old, new, 1)

          # De toon is een echte TeamSpeak-uitzending:
          # PCM gaat via de bestaande MicCapture naar de connector.

          voice_once(
              "  private pushToTalkActive = false;",
              '''  private pushToTalkActive = false;
            private rogerBeepEnabled = false;
            private rogerBeepSamples: Float32Array | null = null;
            private rogerBeepCursor = 0;''',
              "audiostatus",
          )

          voice_once(
              '''  setPushToTalk(
              active: boolean
            ): void {
              this.pushToTalkActive = active;
            }''',
              '''  setRogerBeep(enabled: boolean): void {
              this.rogerBeepEnabled = enabled;

              if (!enabled) {
                this.rogerBeepSamples = null;
                this.rogerBeepCursor = 0;
              }
            }

            private makeRogerBeep(): Float32Array {
              // Drie oplopende tonen via 48 kHz mono.
              const frequencies = [700, 950, 1200];
              const toneLength = Math.round(SAMPLE_RATE * 0.120);
              const gapLength = Math.round(SAMPLE_RATE * 0.000);
              const silenceLength = Math.round(SAMPLE_RATE * 0.055);

              const samples = new Float32Array(
                frequencies.length * (toneLength + gapLength) + silenceLength
              );

              const fadeLength = Math.round(SAMPLE_RATE * 0.005);
              let offset = 0;

              for (const frequency of frequencies) {
                for (let n = 0; n < toneLength; n++) {
                  const fade = Math.min(
                    1,
                    n / fadeLength,
                    (toneLength - n - 1) / fadeLength
                  );

                  samples[offset + n] =
                    Math.sin(2 * Math.PI * frequency * n / SAMPLE_RATE) *
                    Math.max(0, fade) * 0.198;
                }

                offset += toneLength + gapLength;
              }

              return samples;
            }

            setPushToTalk(active: boolean): void {
              if (active) {
                this.rogerBeepSamples = null;
                this.rogerBeepCursor = 0;
              } else if (
                this.pushToTalkActive &&
                this.transmissionMode === "ptt" &&
                this.rogerBeepEnabled
              ) {
                // Slechts één piep per keer loslaten.
                this.rogerBeepSamples = this.makeRogerBeep();
                this.rogerBeepCursor = 0;
                this.pending = [];
              }

              this.pushToTalkActive = active;
            }''',
              "loslaten PTT",
          )

          voice_once(
              '''      const shouldBeActive =
                  this.extra !== null ||
                  this.transmissionMode === "continuous" ||
                  (
                    this.transmissionMode === "ptt"
                      ? this.pushToTalkActive
                      : now < this.activeUntil
                  );''',
              '''      const shouldBeActive =
                  this.extra !== null ||
                  this.rogerBeepSamples !== null ||
                  this.transmissionMode === "continuous" ||
                  (
                    this.transmissionMode === "ptt"
                      ? this.pushToTalkActive
                      : now < this.activeUntil
                  );''',
              "PTT-audio actief houden tijdens piep",
          )

          voice_once(
              '      for (let i = 0; i < input.length; i++) this.pending.push(input[i]);',
              '''      const roger = this.rogerBeepSamples;

                for (let i = 0; i < input.length; i++) {
                  if (roger) {
                    this.pending.push(
                      this.rogerBeepCursor < roger.length
                        ? roger[this.rogerBeepCursor++]
                        : 0
                    );
                  } else {
                    this.pending.push(input[i]);
                  }
                }

                if (roger && this.rogerBeepCursor >= roger.length) {
                  this.rogerBeepSamples = null;
                  this.rogerBeepCursor = 0;
                }''',
              "eindtoon in PCM-audiokaders",
          )

          voice_once(
              '  stop(): void {',
              '''  stop(): void {
              this.rogerBeepSamples = null;
              this.rogerBeepCursor = 0;''',
              "PTT-stop maakt piep leeg",
          )

          # Instelling bewaren, standaard uit.

          app_once(
              '''const [tsNlPanel, setTsNlPanel] = useState<"menu" | "info" | "users" | "chat" | "settings" | "background" | null>(null);''',
              '''const [tsNlPanel, setTsNlPanel] = useState<"menu" | "info" | "users" | "chat" | "settings" | "background" | null>(null);

                      const [tsnlRogerEnabled, setTsnlRogerEnabled] = useState(
                        () => localStorage.getItem("ptt-ts-nl:roger-beep") === "1"
                      );

                      useEffect(() => {
                        localStorage.setItem(
                          "ptt-ts-nl:roger-beep",
                          tsnlRogerEnabled ? "1" : "0"
                        );

                        micCaptureRef.current?.setRogerBeep(tsnlRogerEnabled);
                      }, [tsnlRogerEnabled]);''',
              "aan/uit instelling",
          )

          app_once(
              '''      micCaptureRef.current = mic;
          ''',
              '''      micCaptureRef.current = mic;
                mic.setRogerBeep(tsnlRogerEnabled);
          ''',
              "instelling ook bij nieuwe microfoon toepassen",
          )

          # Hersteld in versie 0.5.1:
          # Zoekt niet meer op een volledig ingesprongen codeblok.

          app_once(
              '<strong>⚙ Instellingen</strong>',
              '''<strong>⚙ Instellingen</strong>

                        <label className="tsnl-roger-row">
                          <input
                            type="checkbox"
                            checked={tsnlRogerEnabled}
                            onChange={event =>
                              setTsnlRogerEnabled(event.target.checked)
                            }
                          />
                          <span>3-tonige rogerpiep</span>
                        </label>

                        <p className="tsnl-roger-description">
                          Na het loslaten van PTT horen andere
                          TeamSpeak-gebruikers de rogerpiep.
                          Standaard uit.
                        </p>''',
              "schakelaar in Android-instellingen",
          )

          voice_file.write_text(voice, encoding="utf-8")
          app_file.write_text(app, encoding="utf-8")

          with css_file.open("a", encoding="utf-8") as css:
              css.write('''
          /* 3-tonige rogerpiep in het instellingenmenu. */

          .ts-app.tsnl-android .tsnl-roger-row {
            display:flex;
            align-items:center;
            gap:12px;
            border:1px solid rgba(194,218,255,.35);
            border-radius:12px;
            padding:10px 12px;
            font-size:15px;
            cursor:pointer;
          }

          .ts-app.tsnl-android .tsnl-roger-row input {
            width:20px;
            height:20px;
            flex:0 0 20px;
            accent-color:#64d4a7;
          }

          .ts-app.tsnl-android .tsnl-roger-description {
            line-height:1.45;
            font-size:12px;
            color:#c7d8f2;
          }
          ''')

          pkg_path = Path("windows/package.json")
          package = json.loads(pkg_path.read_text(encoding="utf-8"))
          package["version"] = "0.5.1"

          pkg_path.write_text(
              json.dumps(
                  package,
                  indent=2,
                  ensure_ascii=False
              ) + "\n",
              encoding="utf-8",
          )

          print("PTT-TS-NL 0.5.1: 3-tonige rogerpiep toegevoegd")
          PY

      - name: TeamSpeak connector bouwen
        shell: bash
        run: |
          set -euo pipefail
          cd upstream/connector
          cargo build --release

      - name: TeamSpeak gateway bouwen
        shell: bash
        run: |
          set -euo pipefail
          cd upstream/gateway
          npm ci
          npm run build
          npm prune --omit=dev

      - name: Windows interface en TypeScript bouwen
        shell: bash
        env:
          VITE_DONATE_URL: ""
        run: |
          set -euo pipefail
          cd upstream/web
          npm ci
          npm run build

      - name: TeamSpeak onderdelen bundelen
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p windows/runtime/web
          mkdir -p windows/runtime/gateway
          mkdir -p windows/runtime/connector

          cp -R upstream/web/dist/. \
            windows/runtime/web/

          cp -R upstream/gateway/dist \
            windows/runtime/gateway/dist

          cp -R upstream/gateway/node_modules \
            windows/runtime/gateway/node_modules

          cp upstream/connector/target/release/ts-connector.exe \
            windows/runtime/connector/ts-connector.exe

          cp upstream/LICENSE \
            windows/runtime/LICENSE-WebSpeak3.txt

          cp android-source/LICENSE \
            windows/runtime/LICENSE-TS6-Droid-GPLv3.txt

          test -s \
            windows/runtime/connector/ts-connector.exe

          node --check windows/main.cjs

      - name: Windows EXE en installer bouwen
        shell: bash
        run: |
          set -euo pipefail
          cd windows
          npm install --no-audit --no-fund
          npm run dist

      - name: Windows EXE beschikbaar maken
        uses: actions/upload-artifact@v4
        with:
          name: PTT-TS-NL-Windows-64bit
          path: windows/dist/*.exe
          if-no-files-found: error
          retention-days: 30
