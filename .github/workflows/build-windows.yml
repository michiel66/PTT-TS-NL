          }

          .ts-app.tsnl-android .tsnl-offline div {
            font-size:56px;
          }

          .ts-app.tsnl-android .tsnl-offline strong {
            font-size:28px;
          }

          .ts-app.tsnl-android .tsnl-offline button {
            background:#b7d1f1;
