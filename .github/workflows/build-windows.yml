          }

          .ts-app.tsnl-android .tsnl-footer {
            flex:0 0 auto;
            height:160px;
            margin:6px 22px 19px;
            padding:12px 22px;
            background:linear-gradient(180deg,#ffffff5a,#c4def143);
            border:1.5px solid #d5e9ff77;
