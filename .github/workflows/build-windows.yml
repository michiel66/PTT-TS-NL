          }

          .ts-app.tsnl-android .tsnl-ptt {
            width:112px;
            height:112px;
            min-width:90px;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            gap:1px;
            background:#ffffff0b;
            border:1.5px solid #e6eff9ad;
            border-radius:100%;
            color:#fff;
            cursor:pointer;
            touch-action:none;
            user-select:none;
            -webkit-user-select:none;
          }

          .ts-app.tsnl-android .tsnl-ptt span {
            font-size:43px;
            line-height:1.1;
            pointer-events:none;
          }

          .ts-app.tsnl-android .tsnl-ptt small {
            font-size:16px;
            font-weight:700;
            pointer-events:none;
          }

          .ts-app.tsnl-android .tsnl-ptt:disabled {
            opacity:.43;
            cursor:default;
          }

          .ts-app.tsnl-android .tsnl-ptt-active {
            background:#60d9878a;
            box-shadow:0 0 27px #77ebaa88;
          }

          .ts-app.tsnl-android .tsnl-popup {
            position:absolute;
            top:79px;
            right:16px;
            z-index:110;
            background:#214775;
            border:1px solid #b5ceff88;
            border-radius:17px;
            box-shadow:0 14px 40px #081729ae;
            max-width:min(95%,390px);
            max-height:60%;
            overflow:auto;
            padding:20px;
            display:flex;
            flex-direction:column;
            gap:10px;
            color:#fff;
            font-size:14px;
          }

          .ts-app.tsnl-android .tsnl-popup button {
            background:#3770aa;
            color:#fff;
            border:0;
            border-radius:10px;
            min-height:39px;
            padding:9px 13px;
            cursor:pointer;
            text-align:left;
          }

          .ts-app.tsnl-android .tsnl-popup .tsnl-popup-close {
            align-self:flex-end;
            font-size:24px;
            width:40px;
            text-align:center;
          }

          .ts-app.tsnl-android .tsnl-chat-messages {
            max-height:250px;
            overflow:auto;
          }

          .ts-app.tsnl-android .tsnl-popup form {
            display:flex;
            gap:5px;
          }

          .ts-app.tsnl-android .tsnl-popup input {
            background:#102f5b;
            color:#fff;
            border:1px solid #719fdb;
            border-radius:9px;
            min-width:0;
            flex:1;
            padding:10px;
          }

          @media(max-width:730px) {
            .ts-app.tsnl-android .tsnl-top {
              height:65px;
              padding:5px 4px;
            }

            .ts-app.tsnl-android .tsnl-top button {
              min-width:31px;
              font-size:23px;
            }

            .ts-app.tsnl-android .tsnl-server-title {
              font-size:16px;
            }

            .ts-app.tsnl-android .tsnl-channel {
              font-size:16px;
              min-height:53px;
            }

            .ts-app.tsnl-android .tsnl-user {
              font-size:15px;
              min-height:55px;
            }

            .ts-app.tsnl-android .tsnl-avatar {
              width:41px;
              height:41px;
              flex-basis:41px;
              font-size:20px;
            }

            .ts-app.tsnl-android .tsnl-footer {
              margin:5px 10px 10px;
              height:122px;
              padding:8px 6px;
              border-radius:30px;
            }

            .ts-app.tsnl-android .tsnl-minor {
              min-width:33px;
              font-size:23px;
            }

            .ts-app.tsnl-android .tsnl-ptt {
              width:87px;
              height:87px;
              min-width:83px;
            }

            .ts-app.tsnl-android .tsnl-ptt span {
              font-size:34px;
            }
          }
          '''

          with css_file.open('a',encoding='utf-8') as f:
              f.write('\n'+css+'\n')

          base = Path('pttbase/windows')
          out = Path('windows')
          out.mkdir(exist_ok=True)

          main = (base/'main.cjs').read_text(encoding='utf-8')

          assert 'const PTT_PORT = 32137;' in main
          assert '"persist:pttconnect"' in main

          main = main.replace(
              'const PTT_PORT = 32137;',
              'const PTT_PORT = 32138;'
          )

          main = main.replace(
              '"persist:pttconnect"',
              '"persist:ptt-ts-nl"'
          )

          main = main.replace('PTT Connect', 'PTT-TS-NL')

          (out/'main.cjs').write_text(
              main, encoding='utf-8'
          )

          pkg = json.loads(
              (base/'package.json').read_text(encoding='utf-8')
          )

          pkg['name'] = 'ptt-ts-nl'
          pkg['version'] = '0.4.0'
          pkg['description'] = (
              'PTT-TS-NL volledig TS6 Droid kanaalscherm Windows'
          )

          pkg['build']['appId'] = 'nl.ptt.ts.windows'
          pkg['build']['productName'] = 'PTT-TS-NL'

          pkg['build']['files'] = [
              'main.cjs',
              'package.json',
              'PTT-TS-NL.ico'
          ]

          pkg['build']['win']['icon'] = 'PTT-TS-NL.ico'
          pkg['build']['nsis']['installerIcon'] = 'PTT-TS-NL.ico'
          pkg['build']['nsis']['uninstallerIcon'] = 'PTT-TS-NL.ico'
          pkg['build']['nsis']['shortcutName'] = 'PTT-TS-NL'

          pkg['build']['nsis']['artifactName'] = (
              'PTT-TS-NL-Setup-${version}-${arch}.${ext}'
          )

          pkg['build']['portable'] = {
              'artifactName':
              'PTT-TS-NL-Portable-${version}-${arch}.${ext}'
          }

          (out/'package.json').write_text(
              json.dumps(pkg, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8'
          )

          shutil.copyfile(
              base/'PTTConnect.ico',
              out/'PTT-TS-NL.ico'
          )

          index = Path('upstream/web/index.html')
          if index.is_file():
              index.write_text(
                  index.read_text(encoding='utf-8')
                  .replace('WebSpeak3','PTT-TS-NL')
                  .replace('PTT Connect','PTT-TS-NL'),
                  encoding='utf-8'
              )

          print('PTT-TS-NL 0.4.0: Android-weergave toegevoegd')
          PY

      - name: Eigen achtergrond toevoegen aan instellingen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          app_path = Path('upstream/web/src/App.tsx')
          css_path = Path('upstream/web/src/App.css')
          app = app_path.read_text(encoding='utf-8')

          def change(old, new, name):
              global app
              amount = app.count(old)
              if amount != 1:
                  raise RuntimeError(
                      f'{name}: verwacht precies één locatie, gevonden {amount}'
                  )
              app = app.replace(old, new, 1)

          # Eigen achtergrond lokaal opslaan via IndexedDB.
          helpers = r'''
          function tsNlBackgroundDb(): Promise<IDBDatabase> {
            return new Promise((resolve, reject) => {
              const request = indexedDB.open("ptt-ts-nl-background", 1);
              request.onupgradeneeded = () => {
                if (!request.result.objectStoreNames.contains("wallpapers")) {
                  request.result.createObjectStore("wallpapers");
                }
              };
              request.onsuccess = () => resolve(request.result);
              request.onerror = () =>
                reject(request.error ?? new Error("Database niet beschikbaar"));
            });
          }

          async function tsNlReadWallpaper(): Promise<Blob | null> {
            const db = await tsNlBackgroundDb();

            return new Promise((resolve, reject) => {
              const transaction = db.transaction("wallpapers", "readonly");
              const request =
                transaction.objectStore("wallpapers").get("selected");

              request.onsuccess = () =>
                resolve(request.result instanceof Blob ? request.result : null);

              request.onerror = () =>
                reject(request.error ?? new Error("Kan achtergrond niet lezen"));

              transaction.oncomplete = () => db.close();

              transaction.onabort = () => {
                db.close();
                reject(transaction.error ?? new Error("Lezen afgebroken"));
              };
            });
          }

          async function tsNlSaveWallpaper(blob: Blob | null): Promise<void> {
            const db = await tsNlBackgroundDb();

            return new Promise((resolve, reject) => {
              const transaction = db.transaction("wallpapers", "readwrite");
              const store = transaction.objectStore("wallpapers");

              if (blob) store.put(blob, "selected");
              else store.delete("selected");

              transaction.oncomplete = () => {
                db.close();
                resolve();
              };

              transaction.onerror = () => {
                db.close();
                reject(
                  transaction.error ?? new Error("Opslaan mislukt")
                );
              };

              transaction.onabort = () => {
                db.close();
                reject(
                  transaction.error ?? new Error("Opslaan afgebroken")
                );
              };
            });
          }

          '''

          change(
              'function AppInner() {',
              helpers + 'function AppInner() {',
              'Wallpaper opslagfuncties'
          )

          old_state = (
              'const [tsNlPanel, setTsNlPanel] = '
              'useState<"menu" | "info" | "users" | "chat" | null>(null);'
          )

          new_state = r'''const [tsNlPanel, setTsNlPanel] = useState<"menu" | "info" | "users" | "chat" | "settings" | "background" | null>(null);
            const tsNlBackgroundInput = useRef<HTMLInputElement | null>(null);
            const [tsNlBackgroundBlob, setTsNlBackgroundBlob] = useState<Blob | null>(null);
            const [tsNlBackgroundUrl, setTsNlBackgroundUrl] = useState<string | null>(null);
            const [tsNlBackgroundError, setTsNlBackgroundError] = useState("");

            useEffect(() => {
              let active = true;
              void tsNlReadWallpaper()
                .then(blob => {
                  if (active) setTsNlBackgroundBlob(blob);
                })
                .catch(() => {
                  if (active)
                    setTsNlBackgroundError("Opgeslagen achtergrond niet beschikbaar.");
                });
              return () => { active = false; };
            }, []);

            useEffect(() => {
              if (!tsNlBackgroundBlob) {
                setTsNlBackgroundUrl(null);
                return;
              }
              const url = URL.createObjectURL(tsNlBackgroundBlob);
              setTsNlBackgroundUrl(url);
              return () => URL.revokeObjectURL(url);
            }, [tsNlBackgroundBlob]);
          '''

          change(
              old_state,
              new_state,
              'Achtergrond state en opstart'
          )

          change(
              '<div className="tsnl-shell">',
              r'''<div
                  className="tsnl-shell"
                  style={tsNlBackgroundUrl ? {
                    backgroundImage: `linear-gradient(180deg, rgba(13,38,78,.40), rgba(13,38,78,.52)), url("${tsNlBackgroundUrl}")`,
                    backgroundSize: "cover",
                    backgroundPosition: "center center",
                    backgroundRepeat: "no-repeat",
                  } : undefined}
                >''',
              'Persoonlijke foto op achtergrond'
          )

          change(
              '<button onClick={() => {setOptionsDialogOpen(true);setTsNlPanel(null);}}>⚙ Instellingen</button>',
              '<button onClick={() => setTsNlPanel("settings")}>⚙ Instellingen</button>',
              'Menu instellingen'
          )

          change(
              '<button className="tsnl-minor" title="Instellingen" onClick={() => setOptionsDialogOpen(true)}>♧</button>',
              '<button className="tsnl-minor" title="Instellingen" onClick={() => setTsNlPanel(v => v === "settings" ? null : "settings")}>♧</button>',
              'Instellingen in onderste balk'
          )

          settings_content = r'''
                      {tsNlPanel === "settings" && <>
                        <strong>⚙ Instellingen</strong>

                        <button type="button" onClick={() => {
                          setOptionsDialogOpen(true);
                          setTsNlPanel(null);
                        }}>🎙 Audio en PTT-instellingen</button>

                        <button type="button" onClick={() => {
                          setTsNlBackgroundError("");
                          setTsNlPanel("background");
                        }}>🖼 Eigen achtergrond</button>
                      </>}

                      {tsNlPanel === "background" && <>
                        <strong>🖼 Eigen achtergrond</strong>

                        <p className="tsnl-background-note">
                          Kies een foto van jouw computer. De foto blijft lokaal
                          bewaard en wordt automatisch hersteld bij het opstarten.
                        </p>

                        <input
                          ref={tsNlBackgroundInput}
                          type="file"
                          className="tsnl-background-file"
                          accept="image/jpeg,image/png,image/webp,image/gif"
                          aria-label="Kies achtergrondafbeelding"
                          onChange={e => {
                            const file = e.currentTarget.files?.[0];
                            e.currentTarget.value = "";
                            if (!file) return;

                            if (![
                              "image/jpeg",
                              "image/png",
                              "image/webp",
                              "image/gif"
                            ].includes(file.type)) {
                              setTsNlBackgroundError(
                                "Gebruik JPG, PNG, WebP of GIF."
                              );
                              return;
                            }

                            if (file.size > 12 * 1024 * 1024) {
                              setTsNlBackgroundError(
                                "Kies een afbeelding kleiner dan 12 MB."
                              );
                              return;
                            }

                            void tsNlSaveWallpaper(file).then(() => {
                              setTsNlBackgroundBlob(file);
                              setTsNlBackgroundError("");
                            }).catch(() => {
                              setTsNlBackgroundError(
                                "Opslaan mislukt. Controleer de schijfruimte."
                              );
                            });
                          }}
                        />

                        <button type="button" onClick={() =>
                          tsNlBackgroundInput.current?.click()
                        }>
                          📁 Afbeelding kiezen
                        </button>

                        <button type="button" onClick={() => {
                          void tsNlSaveWallpaper(null).then(() => {
                            setTsNlBackgroundBlob(null);
                            setTsNlBackgroundError("");
                          }).catch(() => {
                            setTsNlBackgroundError("Herstellen mislukt.");
                          });
                        }}>
                          🔄 Standaard blauwe achtergrond
                        </button>

                        {tsNlBackgroundError &&
                          <p className="tsnl-background-error" role="alert">
                            {tsNlBackgroundError}
                          </p>
                        }

                        <button type="button"
                          onClick={() => setTsNlPanel("settings")}>
                          ← Terug naar instellingen
                        </button>
                      </>}

          '''

          change(
              '                      {tsNlPanel === "info" && <>',
              settings_content + '                      {tsNlPanel === "info" && <>',
              'Achtergrondmenu in instellingen'
          )

          app_path.write_text(app, encoding='utf-8')

          css = r'''
          /* Eigen achtergrond achter kanalen en gebruikers */

          .ts-app.tsnl-android .tsnl-background-file {
            display:none!important;
          }

          .ts-app.tsnl-android .tsnl-background-note {
            font-size:13px;
            line-height:1.5;
            color:#d8e9ff;
            margin:4px 0 8px;
          }

          .ts-app.tsnl-android .tsnl-background-error {
            color:#ffd4da;
            font-size:12px;
            line-height:1.5;
          }

          .ts-app.tsnl-android .tsnl-channelname,
          .ts-app.tsnl-android .tsnl-username,
          .ts-app.tsnl-android .tsnl-spacer {
            text-shadow:0 1px 4px rgba(10,27,60,.55);
          }

          .ts-app.tsnl-android .tsnl-list {
            background:transparent!important;
          }
          '''

          with css_path.open('a', encoding='utf-8') as output:
              output.write("\n" + css + "\n")

          print(
              "Eigen achtergrond: kiezen, lokaal bewaren, "
              "verwijderen en automatisch laden toegevoegd"
          )
          PY

      - name: TeamSpeak connector bouwen
        shell: bash
        run: |
          set -euo pipefail
          cd upstream/connector
          cargo build --release

      - name: TeamSpeak gateway bouwen
        shell: bash
        run: |
          set -euo pipefail
          cd upstream/gateway
          npm ci
          npm run build
          npm prune --omit=dev

      - name: Interface en TypeScript controleren
        shell: bash
        env:
          VITE_DONATE_URL: ""
        run: |
          set -euo pipefail
          cd upstream/web
          npm ci
          npm run build

      - name: TeamSpeak onderdelen voor Windows bundelen
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p windows/runtime/web
          mkdir -p windows/runtime/gateway
          mkdir -p windows/runtime/connector

          cp -R upstream/web/dist/. \
            windows/runtime/web/

          cp -R upstream/gateway/dist \
            windows/runtime/gateway/dist

          cp -R upstream/gateway/node_modules \
            windows/runtime/gateway/node_modules

          cp upstream/connector/target/release/ts-connector.exe \
            windows/runtime/connector/ts-connector.exe

          cp upstream/LICENSE \
            windows/runtime/LICENSE-WebSpeak3.txt

          cp android-source/LICENSE \
            windows/runtime/LICENSE-TS6-Droid-GPLv3.txt

          test -s windows/runtime/connector/ts-connector.exe

          node --check windows/main.cjs

      - name: Installer en portable Windows EXE bouwen
        shell: bash
        run: |
          set -euo pipefail
          cd windows
          npm install --no-audit --no-fund
          npm run dist

      - name: Windows EXE downloaden via Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PTT-TS-NL-Windows-64bit
          path: windows/dist/*.exe
          if-no-files-found: error
          retention-days: 30
