
name: Bouw PTT-TS-NL Windows 0.4 Eigen achtergrond

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: PTT-TS-NL Windows 64-bit
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      WEBSPEAK3_COMMIT: c2b52b323d2ef10e388b2b600444a98390c5cc7a
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout PTT-TS-NL
        uses: actions/checkout@v4

      - name: Werkende Windows TeamSpeak basis ophalen
        uses: actions/checkout@v4
        with:
          repository: michiel66/PTTConnect-PC
          ref: 8ed94f98dae6cfce47e90116fe58b2f4392a6919
          path: pttbase

      - name: Nederlandse Android aanpassingen ophalen
        uses: actions/checkout@v4
        with:
          repository: michiel66/TS6-Droid-NL
          path: android-nl

      - name: Android schermen en kleuren ophalen
        uses: actions/checkout@v4
        with:
          repository: YUAXI/TS6_Droid_CN
          ref: 56d3b4d1991a4c565b1f75f419f4563e772f9614
          path: android-source

      - name: Node.js 22 installeren
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python 3.12 installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rust installeren
        uses: dtolnay/rust-toolchain@stable

      - name: TeamSpeak broncode downloaden
        shell: bash
        run: |
          set -euo pipefail
          git clone --recurse-submodules https://github.com/Moepchi/webspeak3.git upstream
          cd upstream
          git checkout "$WEBSPEAK3_COMMIT"
          git submodule update --init --recursive

      - name: Bestaande werkende TeamSpeak en PTT functies behouden
        shell: bash
        run: |
          set -euo pipefail
          python pttbase/windows/patch_webspeak3.py

      - name: Bouw alleen het TS6 Droid scherm met live kanalen en PTT
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import shutil

          app_file = Path('upstream/web/src/App.tsx')
          css_file = Path('upstream/web/src/App.css')
          app = app_file.read_text(encoding='utf-8')

          def change(needle: str, replacement: str, label: str) -> None:
              global app
              amount = app.count(needle)
              if amount != 1:
                  raise RuntimeError(f'{label}: verwacht 1 locatie, gevonden {amount}')
              app = app.replace(needle, replacement, 1)

          # Android-broncode als ontwerpbron.
          # De Windows-TeamSpeak-connector blijft intact.
          android_screen = Path(
              'android-source/app/src/main/kotlin/'
              'dev/tsdroid/ui/screen/ServerScreen.kt'
          )
          if not android_screen.is_file():
              raise RuntimeError('Android ServerScreen.kt ontbreekt')

          change(
              '  const [connectDialogOpen, setConnectDialogOpen] = useState(true);',
              '''  const [connectDialogOpen, setConnectDialogOpen] = useState(false);
            const [tsNlPanel, setTsNlPanel] = useState<"menu" | "info" | "users" | "chat" | null>(null);''',
              'Nieuwe TS6 starttoestand',
          )

          component = r'''
          function TsNlTree({
            channels, clients, talkers, selected, ownClientId,
            onSelect, onJoin, onPrivateChat,
          }: {
            channels: ChannelInfo[];
            clients: ClientInfo[];
            talkers: Set<number>;
            selected: SelectedItem | null;
            ownClientId: number | null;
            onSelect: (item: SelectedItem) => void;
            onJoin: (channelId: number) => void;
            onPrivateChat: (id: number, name: string) => void;
          }) {
            const [closed, setClosed] = useState<Set<number>>(new Set());
            const colors = [
              "#f94376", "#44aaf1", "#28a598",
              "#5eb878", "#a84cb4", "#ff754b"
            ];

            const renderBranch = (parent: number, level: number): ReactNode => {
              if (level > 15) return null;

              return channels.filter(c => c.parent === parent)
                .sort((a, b) => a.order - b.order)
                .map(ch => {
                  const spacer = spacerDisplayName(ch.name, parent === 0);
                  const members = clients.filter(c => c.channel === ch.id);
                  const hasSub = channels.some(c => c.parent === ch.id);
                  const collapsed = closed.has(ch.id);

                  if (spacer.isSpacer) return (
                    <div key={ch.id} className="tsnl-spacer">
                      {spacer.isLine
                        ? <span className="tsnl-separator" />
                        : spacer.label}
                    </div>
                  );

                  return (
                    <section className="tsnl-branch" key={ch.id}>
                      <button
                        className={`tsnl-channel${
                          selected?.type === "channel" &&
                          selected.id === ch.id ? " tsnl-chosen" : ""
                        }`}
                        type="button"
                        title="Klik om dit kanaal te openen"
                        style={{ paddingLeft: `${14 + level * 16}px` }}
                        onClick={() => {
                          onSelect({type: "channel", id: ch.id});
                          onJoin(ch.id);
                        }}
                      >
                        <span className="tsnl-wave" aria-hidden="true">◉</span>
                        <span className="tsnl-channelname">{ch.name}</span>
                        {ch.hasPassword && <span>🔒</span>}
                        {members.length > 0 &&
                          <span className="tsnl-count">
                            ({members.length})
                          </span>}
                        {hasSub &&
                          <span className="tsnl-fold" onClick={e => {
                            e.preventDefault();
                            e.stopPropagation();
                            setClosed(current => {
                              const next = new Set(current);
                              next.has(ch.id)
                                ? next.delete(ch.id)
                                : next.add(ch.id);
                              return next;
                            });
                          }}>
                            {collapsed ? "▸" : "▾"}
                          </span>}
                      </button>

                      {!collapsed && members.map(c => (
                        <button
                          type="button"
                          key={c.id}
                          className={`tsnl-user${
                            talkers.has(c.id) ? " tsnl-speaking" : ""
                          }${
                            selected?.type === "client" &&
                            selected.id === c.id ? " tsnl-chosen" : ""
                          }`}
                          style={{paddingLeft: `${48 + level * 16}px`}}
                          title={c.id === ownClientId
                            ? c.name
                            : `Dubbelklik voor privéchat met ${c.name}`}
                          onClick={() =>
                            onSelect({type:"client", id:c.id})
                          }
                          onDoubleClick={() => {
                            if(c.id !== ownClientId)
                              onPrivateChat(c.id,c.name);
                          }}
                        >
                          <span
                            className="tsnl-avatar"
                            style={{
                              backgroundColor:
                                colors[Math.abs(c.id) % colors.length]
                            }}
                          >
                            {c.name.charAt(0).toUpperCase() || "·"}
                          </span>

                          <span className="tsnl-username">{c.name}</span>

                          {talkers.has(c.id) &&
                            <span className="tsnl-talk">SPREEKT</span>}

                          {c.inputMuted &&
                            <span
                              className="tsnl-status"
                              title="Microfoon gedempt"
                            >🎙̸</span>}

                          <span
                            className="tsnl-user-actions"
                            aria-hidden="true"
                          >♙</span>

                          <span
                            className="tsnl-user-actions"
                            aria-hidden="true"
                          >
                            {c.outputMuted ? "🔇" : "◁"}
                          </span>
                        </button>
                      ))}

                      {!collapsed && renderBranch(ch.id, level + 1)}
                    </section>
                  );
                });
            };

            return (
              <div className="tsnl-tree">
                {renderBranch(0, 0)}
              </div>
            );
          }

          '''

          change(
              'function AppInner() {',
              component + 'function AppInner() {',
              'Android kanaalcomponent'
          )

          change(
              'ts-ptt-color-${pttColorTheme}',
              'ts-ptt-color-${pttColorTheme} tsnl-android',
              'Android schermklasse'
          )

          screen = r'''
                <div className="tsnl-shell">
                  <nav className="tsnl-top" aria-label="PTT-TS-NL bediening">
                    <button title="Start"
                      onClick={() => {
                        setTsNlPanel(null);
                        setSelected({type:"server"});
                      }}>⌂</button>

                    <button title="Menu"
                      onClick={() =>
                        setTsNlPanel(v => v === "menu" ? null : "menu")
                      }>☰</button>

                    <button title="Server verbinden"
                      onClick={() => setConnectDialogOpen(true)}>🌍</button>

                    <span
                      className="tsnl-server-title"
                      title={serverName || host}
                    >
                      {serverName || host || "PTT-TS-NL"}
                    </span>

                    <button title="Gebruikers"
                      onClick={() =>
                        setTsNlPanel(v => v === "users" ? null : "users")
                      }>♙</button>

                    <button title="Serverinformatie"
                      onClick={() =>
                        setTsNlPanel(v => v === "info" ? null : "info")
                      }>ⓘ</button>

                    <button title="Favorieten"
                      onClick={() =>
                        setFavoritesDialogMode({kind:"manage"})
                      }>▤</button>

                    <button title="Verbinding verbreken"
                      disabled={!connected}
                      onClick={() => handleDisconnect()}>⇥</button>
                  </nav>

                  <div className="tsnl-list">
                    {connected ? (
                      <TsNlTree
                        channels={channels}
                        clients={treeClients}
                        talkers={displayTalkers}
                        selected={selected}
                        ownClientId={ownClient?.id ?? ownClientId}
                        onSelect={handleSelectItem}
                        onJoin={handleSwitchChannel}
                        onPrivateChat={(id, name) => {
                          handleOpenPrivateChat(id, name);
                          setTsNlPanel("chat");
                        }}
                      />
                    ) : (
                      <div className="tsnl-offline">
                        <div>📡</div>
                        <strong>PTT-TS-NL</strong>
                        <span>Niet verbonden met TeamSpeak</span>
                        <button
                          onClick={() => setConnectDialogOpen(true)}
                        >Verbinden</button>
                      </div>
                    )}
                  </div>

                  {tsNlPanel && (
                    <div
                      className="tsnl-popup"
                      role="dialog"
                      aria-label="Extra bediening"
                    >
                      <button
                        className="tsnl-popup-close"
                        onClick={() => setTsNlPanel(null)}
                        title="Sluiten"
                      >×</button>

                      {tsNlPanel === "menu" && <>
                        <strong>PTT-TS-NL</strong>

                        <button onClick={() => {
                          setConnectDialogOpen(true);
                          setTsNlPanel(null);
                        }}>🌍 Verbinden</button>

                        <button onClick={() => {
                          setFavoritesDialogMode({kind:"manage"});
                          setTsNlPanel(null);
                        }}>⭐ Favorieten</button>

                        <button onClick={() => {
                          setOptionsDialogOpen(true);
                          setTsNlPanel(null);
                        }}>⚙ Instellingen</button>

                        <button
                          disabled={!connected}
                          onClick={() => {
                            handleDisconnect();
                            setTsNlPanel(null);
                          }}
                        >⇥ Verbinding verbreken</button>
                      </>}

                      {tsNlPanel === "info" && <>
                        <strong>Serverinformatie</strong>
                        <span>
                          {serverName || host || "Geen server"}
                        </span>
                        <span>
                          {channels.length} kanalen ·
                          {" "}{treeClients.length} gebruikers
                        </span>
                      </>}

                      {tsNlPanel === "users" && <>
                        <strong>
                          Gebruikers ({treeClients.length})
                        </strong>
                        {treeClients.map(c =>
                          <span key={c.id}>{c.name}</span>
                        )}
                      </>}

                      {tsNlPanel === "chat" && <>
                        <strong>Chat</strong>
                        <div className="tsnl-chat-messages">
                          {(
                            activeTab === "channel"
                              ? chat
                              : activeTab === "server"
                              ? serverChat
                              : pmThreads[activeTab]?.messages ?? []
                          ).slice(-30).map((entry, i) =>
                            <p key={i}>
                              {"from" in entry ? entry.from : ""}:
                              {" "}{entry.message}
                            </p>
                          )}
                        </div>

                        <form onSubmit={e => {
                          e.preventDefault();
                          handleSendChat();
                        }}>
                          <input
                            value={chatInput}
                            onChange={e =>
                              setChatInput(e.target.value)
                            }
                            placeholder="Bericht typen..."
                          />
                          <button
                            type="submit"
                            disabled={!connected}
                          >Verzend</button>
                        </form>
                      </>}
                    </div>
                  )}

                  <div className="tsnl-footer">
                    <button
                      className="tsnl-minor tsnl-online"
                      title={connected ? "Verbonden" : "Verbinden"}
                      onClick={() =>
                        connected
                          ? setTsNlPanel("info")
                          : setConnectDialogOpen(true)
                      }
                    >◯</button>

                    <button
                      className="tsnl-minor tsnl-green"
                      title="Chat"
                      onClick={() =>
                        setTsNlPanel(v =>
                          v === "chat" ? null : "chat"
                        )
                      }
                    >☏</button>

                    <button
                      className="tsnl-minor"
                      title="Instellingen"
                      onClick={() =>
                        setOptionsDialogOpen(true)
                      }
                    >♧</button>

                    <button
                      type="button"
                      className={`tsnl-ptt${
                        selfActive ? " tsnl-ptt-active" : ""
                      }`}
                      disabled={!connected || !micOn || inputMuted}
                      title="Ingedrukt houden om te praten"

                      onPointerDown={e => {
                        if(!connected || !micOn || inputMuted)
                          return;
                        e.preventDefault();
                        e.currentTarget.setPointerCapture(
                          e.pointerId
                        );
                        micCaptureRef.current?.setPushToTalk(true);
                      }}

                      onPointerUp={() =>
                        micCaptureRef.current?.setPushToTalk(false)
                      }

                      onPointerCancel={() =>
                        micCaptureRef.current?.setPushToTalk(false)
                      }

                      onLostPointerCapture={() =>
                        micCaptureRef.current?.setPushToTalk(false)
                      }
                    >
                      <span>🎙</span>
                      <small>PTT</small>
                    </button>

                    <button
                      className={`tsnl-minor${
                        inputMuted ? " tsnl-muted" : ""
                      }`}
                      title="Microfoon aan/uit"
                      onClick={() => void handleToggleMic()}
                    >
                      {inputMuted ? "🎙̸" : "🎙"}
                    </button>

                    <button
                      className="tsnl-minor"
                      title="Luidspreker aan/uit"
                      onClick={handleToggleOutputMuted}
                      disabled={!connected}
                    >
                      {outputMuted ? "🔇" : "◖))"}
                    </button>
                  </div>
                </div>
          '''

          change(
              '      <main className="ts-body">',
              screen + '      <main className="ts-body">',
              'Vervang hoofdscherm'
          )

          app_file.write_text(app, encoding='utf-8')

          css = r'''
          /* PTT-TS-NL: alleen TS6 Droid scherm */

          .ts-app.tsnl-android {
            height:100vh!important;
            min-height:0!important;
            overflow:hidden!important;
            display:flex!important;
            flex-direction:column!important;
            background:#244f8a!important;
            color:#e8eaf5!important;
            font-family:Roboto,"Segoe UI",sans-serif!important;
          }

          .ts-app.tsnl-android > .ts-menubar,
          .ts-app.tsnl-android > .ts-toolbar,
          .ts-app.tsnl-android > .ts-body,
          .ts-app.tsnl-android > .ts-log,
          .ts-app.tsnl-android > .ts-demo-banner,
          .ts-app.tsnl-android > .ts-session-tabs,
          .ts-app.tsnl-android > .ts-gts-chrome {
            display:none!important;
          }

          .ts-app.tsnl-android .tsnl-shell {
            width:100%;
            max-width:1020px;
            height:100%;
            min-height:0;
            margin:0 auto;
            display:flex;
            flex-direction:column;
            position:relative;
            background:linear-gradient(
              180deg,#25508b 0%,#22518f 70%,#1c4582 100%
            );
            box-shadow:0 0 40px #112d5940;
          }

          .ts-app.tsnl-android .tsnl-top {
            flex:0 0 auto;
            height:75px;
            display:flex;
            align-items:center;
            justify-content:space-around;
            gap:3px;
            padding:9px 14px;
            background:rgba(34,78,139,.84);
            color:#dce6fa;
          }

          .ts-app.tsnl-android .tsnl-top button {
            background:transparent;
            border:0;
            color:#c7d6f2;
            font-size:29px;
            min-width:40px;
            min-height:44px;
            cursor:pointer;
            padding:2px 4px;
            border-radius:12px;
          }

          .ts-app.tsnl-android .tsnl-top button:hover {
            background:#ffffff22;
          }

          .ts-app.tsnl-android .tsnl-top button:disabled {
            opacity:.35;
            cursor:default;
          }

          .ts-app.tsnl-android .tsnl-server-title {
            max-width:180px;
            min-width:40px;
            overflow:hidden;
            white-space:nowrap;
            text-overflow:ellipsis;
            font-size:22px;
            font-weight:500;
            text-align:center;
          }

          .ts-app.tsnl-android .tsnl-list {
            flex:1 1 auto;
            min-height:0;
            overflow:auto;
            padding:0 10px 16px;
            overscroll-behavior:contain;
          }

          .ts-app.tsnl-android .tsnl-spacer {
            color:#c8d7f1;
            text-align:center;
            font-size:17px;
            padding:16px 6px 11px;
            letter-spacing:.02em;
          }

          .ts-app.tsnl-android .tsnl-separator {
            height:1px;
            width:100%;
            display:block;
            background:#8f7e783e;
          }

          .ts-app.tsnl-android .tsnl-channel,
          .ts-app.tsnl-android .tsnl-user {
