
name: Bouw PTT Direct Windows 0.6.1 - TG Voorburg Heerlen

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: PTT Direct Windows 64-bit
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      WEBSPEAK3_COMMIT: c2b52b323d2ef10e388b2b600444a98390c5cc7a
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Project ophalen
        uses: actions/checkout@v4

      - name: Eerder groen gebouwde Android-weergave ophalen
        uses: actions/checkout@v4
        with:
          repository: michiel66/PTT-TS-NL
          ref: 0f0c7cd2416c2a8492dc8f457bc8c629134c4eb1
          path: known-good

      - name: Bewezen versie 0.6.0 ophalen
        uses: actions/checkout@v4
        with:
          repository: michiel66/PTT-TS-NL
          ref: 77881f1f8f5e23fb9b4b968a7a02860a954bfceb
          path: green-060

      - name: Groen gebouwde versie 0.5.1 ophalen
        uses: actions/checkout@v4
        with:
          repository: michiel66/PTT-TS-NL
          ref: 3a10277167685c326fc55b797732bd28cfffde69
          path: green-051

      - name: Werkende TeamSpeak Windows basis ophalen
        uses: actions/checkout@v4
        with:
          repository: michiel66/PTTConnect-PC
          ref: 8ed94f98dae6cfce47e90116fe58b2f4392a6919
          path: pttbase

      - name: Nederlandse Android aanpassingen ophalen
        uses: actions/checkout@v4
        with:
          repository: michiel66/TS6-Droid-NL
          path: android-nl

      - name: Originele Android broncode ophalen
        uses: actions/checkout@v4
        with:
          repository: YUAXI/TS6_Droid_CN
          ref: 56d3b4d1991a4c565b1f75f419f4563e772f9614
          path: android-source

      - name: Node installeren
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rust installeren
        uses: dtolnay/rust-toolchain@stable

      - name: TeamSpeak engine ophalen
        shell: bash
        run: |
          set -euo pipefail
          git clone --recurse-submodules https://github.com/Moepchi/webspeak3.git upstream
          cd upstream
          git checkout "$WEBSPEAK3_COMMIT"
          git submodule update --init --recursive

      - name: Werkende TeamSpeak en PTT functies toepassen
        shell: bash
        run: |
          set -euo pipefail
          python pttbase/windows/patch_webspeak3.py

      - name: Werkende Multicolor 0.6.0 zonder wijzigingen toepassen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          from pathlib import Path

          source = Path(
              'green-060/.github/workflows/build-windows.yml'
          ).read_text(encoding='utf-8')

          for name in [
              'Bewezen werkende TeamSpeak interface achtergrond en rogerpiep toepassen',
              'Multicolor 0.6.0 design uit voorbeeldfoto toepassen',
          ]:
              marker = (
                  f'      - name: {name}\n'
                  '        shell: bash\n'
                  '        run: |\n'
              )

              if source.count(marker) != 1:
                  raise RuntimeError(
                      f'Bronstap ontbreekt: {name}'
                  )

              block = source.split(marker, 1)[1].split(
                  '\n      - name:', 1
              )[0]

              lines = [
                  line[10:] if line.startswith('          ') else line
                  for line in block.splitlines()
              ]

              start = lines.index("python - <<'PY'") + 1
              end = len(lines) - 1 - lines[::-1].index('PY')

              code = '\n'.join(lines[start:end]) + '\n'

              print(
                  f'Werkende stap uitvoeren: {name}',
                  flush=True
              )

              exec(
                  compile(code, name, 'exec'),
                  {'__name__': '__main__'}
              )

          print(
              'Multicolor design, PTT, rogerpiep '
              'en achtergrond behouden'
          )
          PYCODE

      - name: PTT Direct naam, talkgroepen en Voorburg CH-kanalen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          app_file = Path('upstream/web/src/App.tsx')
          css_file = Path('upstream/web/src/App.css')
          pkg_file = Path('windows/package.json')

          app = app_file.read_text(encoding='utf-8')

          def once(old: str, new: str, label: str):
              global app

              count = app.count(old)

              if count != 1:
                  raise RuntimeError(
                      f'{label}: verwacht 1, gevonden {count}'
                  )

              app = app.replace(old, new, 1)

          # ===========================================
          # 1. NAAM PTT DIRECT
          # ===========================================

          # Bestaande multicolor ontwerp blijft gelijk.

          if app.count('PTT Communicator') < 2:
              raise RuntimeError(
                  'Titel PTT Communicator ontbreekt'
              )

          app = app.replace(
              'PTT Communicator',
              'PTT Direct'
          )

          # TeamSpeak tekst onder het logo weghalen.

          once(
              '<small>TeamSpeak · Push-to-Talk</small>',
              '',
              'Ondertitel verwijderen'
          )

          # ===========================================
          # 2. TALKGROEPEN
          # ===========================================

          # Gebruiker hoeft alleen naam en talkgroep
          # te kiezen.
          #
          # Voorburg: ptt.mijnts3.nl
          # Heerlen:  heerlen.mijnts3.nl
          #
          # Serveradres niet zichtbaar in aanmelding.

          state = r'''
            const [
              pttDirectGroup,
              setPttDirectGroup
            ] = useState<"voorburg" | "heerlen">(
              () =>
                localStorage.getItem("pttdirect:group")
                  === "heerlen"
                    ? "heerlen"
                    : "voorburg"
            );

            const [
              pttDirectName,
              setPttDirectName
            ] = useState("");
          '''

          once(
              'function AppInner() {',
              'function AppInner() {' + state,
              'Talkgroep en naam'
          )

          # ===========================================
          # 3. AANMELDEN BIJ OPSTARTEN
          # ===========================================

          once(
              'const [connectDialogOpen, setConnectDialogOpen] = useState(false);',
              'const [connectDialogOpen, setConnectDialogOpen] = useState(true);',
              'Aanmeldvenster bij opstart'
          )

          # ===========================================
          # 4. GEBRUIKERSNAAM
          # ===========================================

          # Geen automatische toevoeging
          # van PTT Connect aan de naam.

          start = app.find(
              'function makePttConnectNickname('
          )

          end = app.find(
              'function redPttDots(',
              start
          )

          if start < 0 or end <= start:
              raise RuntimeError(
                  'Bestaande nickname functie ontbreekt'
              )

          app = (
              app[:start] +
              'function makePttConnectNickname(value: string): string {\n'
              '  return value.trim().slice(0, 30);\n'
              '}\n\n' +
              app[end:]
          )

          # ===========================================
          # 5. NIEUW EENVOUDIG AANMELDSCHERM
          # ===========================================

          # Oude uitgebreide inlogscherm vervangen.
          # Hoofdinterface verandert niet.

          login = r'''
                {connectDialogOpen && (
                  <div className="ts-dialog-backdrop">
                    <form
                      className="ts-dialog pttdirect-login"

                      onSubmit={event => {
                        event.preventDefault();

                        const name =
                          pttDirectName.trim();

                        if (!name || connecting) {
                          return;
                        }

                        const server =
                          pttDirectGroup === "voorburg"
                            ? "ptt.mijnts3.nl"
                            : "heerlen.mijnts3.nl";

                        localStorage.setItem(
                          "pttdirect:group",
                          pttDirectGroup
                        );

                        handleConnect({
                          host: server,
                          nickname: name,
                          serverPassword: "",
                          channelPassword: "",
                          defaultChannel: "",
                          privilegeKey: "",
                          serverType: "teamspeak",
                        });
                      }}
                    >
                      <h2>PTT Direct</h2>

                      <p>
                        Voer je naam in en kies
                        je talkgroep.
                      </p>

                      <label htmlFor="pttdirect-name">
                        Gebruikersnaam
                      </label>

                      <input
                        id="pttdirect-name"
                        type="text"
                        value={pttDirectName}
                        autoFocus
                        maxLength={30}
                        required
                        placeholder="Vul je naam in"

                        onChange={event =>
                          setPttDirectName(
                            event.target.value
                          )
                        }
                      />

                      <label htmlFor="pttdirect-group">
                        Talkgroep
                      </label>

                      <select
                        id="pttdirect-group"
                        value={pttDirectGroup}

                        onChange={event =>
                          setPttDirectGroup(
                            event.target.value as
                              "voorburg" | "heerlen"
                          )
                        }
                      >
                        <option value="voorburg">
                          TG-103 Voorburg
                        </option>

                        <option value="heerlen">
                          TG-108 Heerlen
                        </option>
                      </select>

                      <div className="pttdirect-login-actions">
                        <button
                          type="button"
                          onClick={() =>
                            setConnectDialogOpen(false)
                          }
                        >
                          Annuleren
                        </button>

                        <button
                          type="submit"
                          disabled={
                            !pttDirectName.trim() ||
                            connecting
                          }
                        >
                          {connecting
                            ? "Verbinden..."
                            : "Verbinden"}
                        </button>
                      </div>

                      {connectError && (
                        <p
                          role="alert"
                          className="pttdirect-error"
                        >
                          Verbinding mislukt.
                          Probeer opnieuw.
                        </p>
                      )}
                    </form>
                  </div>
                )}
          '''

          dialog_pattern = (
              r'\{connectDialogOpen && \('
              r'\s*<ConnectDialog\b'
              r'[\s\S]*?\/>\s*\)\}'
          )

          found = list(
              re.finditer(
                  dialog_pattern,
                  app
              )
          )

          if len(found) != 1:
              raise RuntimeError(
                  'Aanmeldvenster: verwacht 1, '
                  f'gevonden {len(found)}'
              )

          original_dialog = found[0].group()

          # Oude dialoog bewaren voor bestaande
          # TypeScript-referenties, niet renderen.

          hidden_dialog = original_dialog.replace(
              '{connectDialogOpen && (',
              '{false && (',
              1
          )

          app = (
              app[:found[0].start()] +
              login.strip('\n') +
              '\n' +
              hidden_dialog +
              app[found[0].end():]
          )

          # ===========================================
          # 6. VOORBURG ALLEEN CH-KANALEN
          # ===========================================

          # TG-103 Voorburg:
          # alleen namen die beginnen met CH.
          #
          # TG-108 Heerlen:
          # alle kanalen tonen.
          #
          # De TeamSpeak-server wordt niet aangepast.

          app, count = re.subn(
              r'(<TsNlTree\s+)channels=\{channels\}',

              lambda m: m.group(1) + '''
                channels={
                  host.trim().toLowerCase() ===
                    "ptt.mijnts3.nl"

                    ? channels
                        .filter(ch =>
                          /^CH/i.test(ch.name.trim())
                        )
                        .map(ch => ({
                          ...ch,
                          parent: 0
                        }))

                    : channels
                }''',

              app,
              count=1,
          )

          if count != 1:
              raise RuntimeError(
                  'Voorburg CH-kanaalfilter: '
                  f'verwacht 1, gevonden {count}'
              )

          # ===========================================
          # 7. TALKGR0EP NAAM TONEN
          # ===========================================

          # Geen serveradres in de serverinformatie.

          once(
              '{serverName || host || "Geen server"}',

              '''{
                host.trim().toLowerCase() ===
                  "ptt.mijnts3.nl"

                  ? "TG-103 Voorburg"
                  : "TG-108 Heerlen"
              }''',

              'Geen adres in serverinformatie'
          )

          app_file.write_text(
              app,
              encoding='utf-8'
          )

          # ===========================================
          # 8. OPMAAK VAN ALLEEN HET AANMELDSCHERM
          # ===========================================

          # Bestaande multicolor interface blijft
          # volledig ongewijzigd.

          with css_file.open(
              'a',
              encoding='utf-8'
          ) as css:

              css.write(r'''
          /* PTT Direct aanmelding */

          .pttdirect-login {
            width:min(420px,calc(100vw - 30px));
            display:flex;
            flex-direction:column;
            gap:13px;
            padding:28px;
            border-radius:20px;
            background:linear-gradient(
              135deg,
              #17213c,
              #261934
            );
            color:#f5f1ff;
            border:1px solid rgba(188,132,236,.65);
            box-shadow:0 24px 75px rgba(0,0,0,.6);
          }

          .pttdirect-login h2 {
            margin:0;
            color:white;
            font-size:25px;
          }

          .pttdirect-login p {
            margin:0 0 5px;
            color:#d2d8ec;
          }

          .pttdirect-login label {
            font-size:14px;
            font-weight:600;
            color:#eff1ff;
          }

          .pttdirect-login input,
          .pttdirect-login select {
            padding:12px 13px;
            min-height:46px;
            width:100%;
            box-sizing:border-box;
            border-radius:10px;
            background:#121a32;
            color:#fff;
            border:1px solid #647498;
            font-size:16px;
          }

          .pttdirect-login input:focus,
          .pttdirect-login select:focus {
            outline:2px solid #22d6c8;
            outline-offset:1px;
          }

          .pttdirect-login-actions {
            display:flex;
            justify-content:flex-end;
            gap:10px;
            margin-top:7px;
          }

          .pttdirect-login-actions button {
            border:1px solid #ae8fe8;
            border-radius:10px;
            padding:10px 17px;
            color:white;
            background:#533c7e;
            cursor:pointer;
          }

          .pttdirect-login-actions button[type="submit"] {
            background:linear-gradient(
              100deg,
              #0b9c96,
              #087b83
            );
            border-color:#30dacf;
            font-weight:700;
          }

          .pttdirect-login-actions button:disabled {
            opacity:.45;
            cursor:default;
          }

          .pttdirect-error {
            color:#ffc2bc!important;
          }
          ''')

          # ===========================================
          # 9. VERSIE
          # ===========================================

          package = json.loads(
              pkg_file.read_text(encoding='utf-8')
          )

          package['version'] = '0.6.1'

          pkg_file.write_text(
              json.dumps(
                  package,
                  indent=2,
                  ensure_ascii=False
              ) + '\n',
              encoding='utf-8'
          )

          print(
              'PTT Direct 0.6.1: naam, eenvoudige '
              'TG-aanmelding en CH-filter toegepast'
          )
          PY

      - name: TeamSpeak connector bouwen
        shell: bash
        run: |
          set -euo pipefail
          cd upstream/connector
          cargo build --release

      - name: TeamSpeak gateway bouwen
        shell: bash
        run: |
          set -euo pipefail
          cd upstream/gateway
          npm ci
          npm run build
          npm prune --omit=dev

      - name: Windows interface en TypeScript bouwen
        shell: bash
        env:
          VITE_DONATE_URL: ""
        run: |
          set -euo pipefail
          cd upstream/web
          npm ci
          npm run build

      - name: TeamSpeak onderdelen bundelen
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p windows/runtime/web
          mkdir -p windows/runtime/gateway
          mkdir -p windows/runtime/connector

          cp -R upstream/web/dist/. \
            windows/runtime/web/

          cp -R upstream/gateway/dist \
            windows/runtime/gateway/dist

          cp -R upstream/gateway/node_modules \
            windows/runtime/gateway/node_modules

          cp upstream/connector/target/release/ts-connector.exe \
            windows/runtime/connector/ts-connector.exe

          cp upstream/LICENSE \
            windows/runtime/LICENSE-WebSpeak3.txt

          cp android-source/LICENSE \
            windows/runtime/LICENSE-TS6-Droid-GPLv3.txt

          test -s \
            windows/runtime/connector/ts-connector.exe

          node --check windows/main.cjs

      - name: Windows EXE en installer bouwen
        shell: bash
        run: |
          set -euo pipefail
          cd windows
          npm install --no-audit --no-fund
          npm run dist

      - name: Windows EXE beschikbaar maken
        uses: actions/upload-artifact@v4
        with:
          name: PTT-TS-NL-Windows-64bit
          path: windows/dist/*.exe
          if-no-files-found: error
          retention-days: 30
