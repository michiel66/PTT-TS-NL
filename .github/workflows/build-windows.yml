          }

          .ts-app.tsnl-android .tsnl-user {
            font-size:18px;
            min-height:65px;
            padding:8px 12px;
          }

          .ts-app.tsnl-android .tsnl-channel:hover,
          .ts-app.tsnl-android .tsnl-user:hover,
          .ts-app.tsnl-android .tsnl-chosen {
